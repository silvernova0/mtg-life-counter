; Sleep firmware for the Waveshare knob's second chip (ESP32-U4WDH).
;
; Waveshare's stock firmware on that chip keeps it running all the time
; (Bluetooth audio), which costs battery while the life counter runs on the
; ESP32-S3. This replaces it with a program that mutes the audio DAC and
; puts the chip into deep sleep for good.
;
; Flash with the knob's USB-C plug flipped (the CH340 bridge port, not the
; S3's port):   python -m platformio run -d tools/u4_sleep -t upload --upload-port COMx
; Back up first: esptool --port COMx --chip esp32 read_flash 0 0x400000 backup.bin
; Restore stock:  esptool --port COMx --chip esp32 write_flash 0 backup.bin

[env:u4_sleep]
platform = espressif32
board = esp32dev
framework = arduino
board_build.flash_size = 4MB
monitor_speed = 115200
